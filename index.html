
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">📚 Smart Library</div>
        <nav>
            <a href="#home">Home</a>
            <a href="#books">Books</a>
            <a href="#add-book">Add Book</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Welcome to Smart Library</h1>
        <p>Discover, Read and Explore Your Favourite Books</p>
        <a href="#books" class="hero-btn">Explore Books</a>
    </section>

    <section class="stats">
        <div class="stat-box">
            <h2 id="totalBooks">0</h2>
            <p>Total Books</p>
        </div>
        <div class="stat-box">
            <h2 id="availableBooks">0</h2>
            <p>Available Books</p>
        </div>
        <div class="stat-box">
            <h2 id="issuedBooks">0</h2>
            <p>Issued Books</p>
        </div>
    </section>

    <section class="library" id="books">
        <h2>Explore Our Books</h2>

        <div class="filters">
            <input type="text" id="searchInput"
                   placeholder="Search by book or author...">

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Programming">Programming</option>
                <option value="Science">Science</option>
                <option value="Fiction">Fiction</option>
                <option value="History">History</option>
                <option value="Education">Education</option>
            </select>
        </div>

        <div class="book-container" id="bookContainer"></div>
    </section>

    <section class="add-section" id="add-book">
        <h2>Add New Book</h2>

        <form id="bookForm">
            <input type="text" id="bookTitle"
                   placeholder="Book Title" required>

            <input type="text" id="bookAuthor"
                   placeholder="Author Name" required>

            <select id="bookCategory" required>
                <option value="">Select Category</option>
                <option value="Programming">Programming</option>
                <option value="Science">Science</option>
                <option value="Fiction">Fiction</option>
                <option value="History">History</option>
                <option value="Education">Education</option>
            </select>

            <button type="submit">Add Book</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Smart Library Management System</p>
        <p>Developed using HTML, CSS and JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
